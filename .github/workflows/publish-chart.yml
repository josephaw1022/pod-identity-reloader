name: Publish Helm chart

on:
  push:
    tags:
      - "v*"
    paths:
      - "charts/pod-identity-reloader/**"
      - ".github/workflows/publish-chart.yml"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Package and publish chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358e9c7b3c5e5 # v4.3.0

      - name: Log in to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and publish chart
        env:
          CHART_VERSION: ${{ startsWith(github.ref_name, 'v') && github.ref_name || '0.1.0' }}
        run: |
          version="${CHART_VERSION#v}"
          helm package charts/pod-identity-reloader --version "$version" --app-version "$version"
          helm push "pod-identity-reloader-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}"
