# Replaces the whole args list (rather than a single index) because
# config/default/manager_metrics_patch.yaml inserts an extra arg ahead of
# these, which would otherwise shift index-based patches. Keep this in sync
# with config/manager/manager.yaml's health-probe flag and
# config/default/manager_metrics_patch.yaml's metrics flag.
- op: replace
  path: /spec/template/spec/containers/0/args
  value:
    - --metrics-bind-address=:8443
    - --leader-elect
    - --health-probe-bind-address=:8081
    - --cluster-name=pod-identity-reloader-local
    # Faster than the 30s production default so local dev/e2e feedback loops
    # (e.g. rotating the sample role) don't require long waits.
    - --poll-interval=5s
- op: add
  path: /spec/template/spec/containers/0/env
  value:
    # LocalStack always runs as a host-level Docker container (see
    # hack/local-dev/localstack-up.sh), not an in-cluster Service, so this
    # value is only a placeholder: hack/local-dev/kind-deploy.sh (and the
    # e2e suite) patch it after apply to the kind Docker network's gateway
    # IP, which is reachable from pods running inside Kind.
    - name: AWS_ENDPOINT_URL
      value: http://localstack.invalid:4566
    - name: AWS_ACCESS_KEY_ID
      value: "test"
    - name: AWS_SECRET_ACCESS_KEY
      value: "test"
    - name: AWS_REGION
      value: us-east-1
