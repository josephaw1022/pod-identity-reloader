name: E2E Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/**"
      - "examples/**"
      - ".agents/**"
      - ".claude/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "charts/**"
      - "examples/**"
      - ".agents/**"
      - ".claude/**"
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      # EKS Pod Identity emulation (CreatePodIdentityAssociation, etc.) is a
      # LocalStack Pro feature; add a repository secret named
      # LOCALSTACK_AUTH_TOKEN (see https://docs.localstack.cloud/getting-started/auth-token/).
      # Not available on pull_request runs from forks or from Dependabot,
      # since GitHub withholds repository secrets from those runs.
      LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Running Test e2e
        run: |
          go mod tidy
          make test-e2e
