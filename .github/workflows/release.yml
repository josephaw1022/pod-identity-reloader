name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Create date-based release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version
        id: version
        run: |
          date_str="$(date -u +%Y-%m-%d)"
          base_tag="v${date_str}"
          tag="$base_tag"
          suffix=1
          while git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; do
            tag="${base_tag}-${suffix}"
            suffix=$((suffix + 1))
          done
          chart_version="${tag#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "chart_version=${chart_version}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${tag} (chart version: ${chart_version})"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build installer manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: make build-installer IMG="${IMAGE}:${TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          docker build --tag "${IMAGE}:${TAG}" --tag "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and publish chart
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          CHART_VERSION: ${{ steps.version.outputs.chart_version }}
        run: |
          echo "$CR_PAT" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package charts/pod-identity-reloader --version "$CHART_VERSION" --app-version "$TAG"
          helm push "pod-identity-reloader-${CHART_VERSION}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/install.yaml \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --generate-notes
