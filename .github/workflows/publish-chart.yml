name: Publish Helm chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/pod-identity-reloader/**"
      - ".github/workflows/publish-chart.yml"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: Package and publish chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        env:
          CR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$CR_PAT" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and publish chart
        env:
          SHA: ${{ github.sha }}
        run: |
          short_sha="${SHA:0:7}"
          version="0.0.1-${short_sha}"
          helm package charts/pod-identity-reloader --version "$version" --app-version "$short_sha"
          helm push "pod-identity-reloader-${version}.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
