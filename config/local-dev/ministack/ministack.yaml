apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  namespace: ministack-system
  labels:
    app.kubernetes.io/name: ministack
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ministack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ministack
    spec:
      containers:
        - name: ministack
          image: ministackorg/ministack:latest
          ports:
            - containerPort: 4566
              name: gateway
          readinessProbe:
            httpGet:
              path: /_ministack/health
              port: 4566
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /_ministack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ministack
  namespace: ministack-system
  labels:
    app.kubernetes.io/name: ministack
spec:
  selector:
    app.kubernetes.io/name: ministack
  ports:
    - name: gateway
      port: 4566
      targetPort: 4566
